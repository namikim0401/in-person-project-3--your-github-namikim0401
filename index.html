<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Data-Driven</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation - Keep from Week 3 -->
    <nav id="navbar">
        <ul class="nav-menu">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main content container -->
    <main>
        <script src="data.js"></script>
        <script src="display.js"></script>

        <!-- The header will be generated by JavaScript -->
        <div id="generated-header">
            <script>document.write(headerHTML);</script>
        </div>

        <!-- About section - keep static for now -->
        <section id="about">
            <h2>About Me</h2>
            <p>This content will soon be data-driven!</p>
        </section>

        <!-- Skills section will be generated -->
        <div id="generated-skills">
            <script>document.write(skillsHTML);</script>
        </div>

        <!-- Projects section will be generated -->
        <div id="generated-projects">
            <script>document.write(projectsHTML);</script>
        </div>

        <!-- Contact section with enhanced form -->
        <section id="contact">
            <h2>Contact Me</h2>
            <p>Let's work together!</p>
            
            <form class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" autocomplete="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">

                <label for="start-date">Preferred Start Date:</label>
                <input type="date" id="start-date" name="start-date">

                <label for="budget">Budget (USD):</label>
                <input type="number" id="budget" name="budget" min="0" step="100">

                <fieldset>
                    <legend>Preferred Contact Method:</legend>
                    <div class="form-row">
                        <input type="radio" id="contact-email" name="contact" value="email">
                        <label for="contact-email">Email</label>
                    </div>
                    <div class="form-row">
                        <input type="radio" id="contact-phone" name="contact" value="phone">
                        <label for="contact-phone">Phone</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Project Timeline:</legend>
                    <div class="form-row">
                        <input type="checkbox" id="asap" name="timeline" value="asap">
                        <label for="asap">ASAP</label>
                    </div>
                    <div class="form-row">
                        <input type="checkbox" id="flexible" name="timeline" value="flexible">
                        <label for="flexible">Flexible</label>
                    </div>
                </fieldset>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

</body>
</html>
